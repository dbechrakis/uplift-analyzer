name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12 (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Set up uv (astral-sh/setup-uv v10.3.2)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Install dependencies with hash verification
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-dev.txt
      - name: Ruff lint
        run: .venv/bin/python -m ruff check .
      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check .
      - name: Pytest with coverage gate
        run: .venv/bin/python -m pytest --cov=core --cov=app --cov-report=term --cov-fail-under=80

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12 (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Set up uv (astral-sh/setup-uv v10.3.2)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Install pip-audit with hash verification
        run: |
          uv venv .audit
          uv pip install --python .audit/bin/python --require-hashes -r requirements-audit.txt
      - name: Audit runtime and dev requirements
        run: |
          .audit/bin/pip-audit --requirement requirements.txt --require-hashes --disable-pip --strict
          .audit/bin/pip-audit --requirement requirements-dev.txt --require-hashes --disable-pip --strict

  docker:
    name: Image build, Trivy scan and compose smoke test
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint Dockerfile (hadolint/hadolint-action v3.5.0)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: deploy/Dockerfile
          failure-threshold: warning
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml --profile llm config --quiet
      - name: Build image
        run: docker build --file deploy/Dockerfile --tag uplift-analyzer:ci .
      - name: Trivy image scan (aquasecurity/trivy-action v0.36.0)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: uplift-analyzer:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
      - name: Trivy misconfiguration scan (aquasecurity/trivy-action v0.36.0)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: config
          scan-ref: deploy
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Compose smoke test
        run: |
          docker tag uplift-analyzer:ci uplift-analyzer:local
          docker compose -f deploy/docker-compose.yml up -d --no-build app nginx
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/healthz
          curl -fsS http://127.0.0.1:8501/_stcore/health
          asset=$(curl -fsS http://127.0.0.1:8501/ | grep -o 'static/js/[^"]*\.js' | head -1)
          test -n "$asset"
          failures=$(seq 1 300 | xargs -P 60 -I{} curl -s -o /dev/null -w "%{http_code}\n" "http://127.0.0.1:8501/${asset}" | grep -vc '^200$' || true)
          test "$failures" -eq 0
      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes
