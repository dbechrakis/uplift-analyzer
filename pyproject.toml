[project]
name = "uplift-analyzer"
version = "0.1.0"
description = "Local-first incrementality analytics on the Criteo Uplift dataset with a local LLM explainer"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools]
packages = ["core", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower model-fitting tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
